[package]
name = "beans"
version = "0.2.0"
edition = "2024"
rust-version = "1.98.1"
publish = false
license = "MIT"

[[bin]]
name = "bn"
path = "src/main.rs"

[workspace]
members = ["crates/beans-kernel"]
exclude = ["tools/verification/probe"]
resolver = "3"

[workspace.lints.rust]
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(verus_only)'] }

[lints]
workspace = true

[dependencies]
beans-kernel = { path = "crates/beans-kernel" }
clap = { version = "=4.6.7", features = ["string"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=1.1.6"
yaml-rust2 = "=0.13.0"
axum = "=0.8.9"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "signal"] }
comrak = { version = "=0.55.0", default-features = false }
notify = "=8.2.0"
getrandom = "=0.4.3"
libc = "=0.2.189"
time = { version = "=0.3.55", features = ["formatting", "parsing", "serde", "large-dates"] }

[dev-dependencies]
proptest = "=1.11.0"
stateright = "=0.31.0"
