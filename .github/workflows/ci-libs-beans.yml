name: ci-libs-beans

on:
  push:
    branches:
      - main
    paths:
      - 'libs/beans/**'
      - 'go.work'
      - 'go.work.sum'
      - '.github/workflows/ci-libs-beans.yml'
  pull_request:
    paths:
      - 'libs/beans/**'
      - 'go.work'
      - 'go.work.sum'
      - '.github/workflows/ci-libs-beans.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: libs/beans

jobs:
  gates:
    name: Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Job-level GOWORK=off makes this job prove libs/beans builds, tests and
    # lints standalone, with no workspace in play.
    env:
      GOWORK: 'off'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: libs/beans/go.mod
          cache: true
          cache-dependency-path: libs/beans/go.sum

      # libs/beans' Makefile invokes golangci-lint from PATH, so CI has to put
      # it there. apps/bean-counter pins its own version inside its Makefile
      # instead; unifying the two invocation styles is deferred follow-up work
      # (decision D7).
      #
      # The version must be built with a Go toolchain at least as new as
      # libs/beans/.golangci.yml's `run.go`. `go install pkg@version` builds
      # with that module's own go directive, and v2.1.6 declares go1.23, so it
      # exits 3 with "the Go language version (go1.23) used to build
      # golangci-lint is lower than the targeted Go version (1.25)".
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: CI gates
        run: make ci

      - name: Integration tests
        run: go test -tags=integration ./...
