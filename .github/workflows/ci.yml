name: ci

# One workflow, no path filters: a required check named after either job is
# always started, so a pull request can never sit pending on a skipped check.
on:
  push:
    branches:
      - main
      - mvp/rust-only-cutover
      - mvp/rust-only-cutover-cleanup
      - mvp/rust-only-cutover-final-journey
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust product and verification (Linux)
    needs: ui
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Download the built UI
        uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: ui/dist
      - name: Install the pinned compiler and checks
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --component llvm-tools --component rustc-dev
      - name: Build and check the Rust product with the complete UI
        run: make build vet lint tidy-check skill-test
      - name: Execute native safety, proofs and production coupling controls
        run: make verify
      - name: Preserve compiler coverage and coupling evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codec-kernel-coupling-linux
          path: |
            .verification/codec-coupling
            .verification/native/report.json
            .verification/retry-coupling
            .verification/*.json
            .verification/*.log
          include-hidden-files: true
          if-no-files-found: error

  ui:
    name: ui
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      # The Rust job embeds and tests this complete app.
      - name: Upload the built UI
        uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: ui/dist
          if-no-files-found: error
