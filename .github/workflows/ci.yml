name: ci

# One workflow, no path filters: a required check named after either job is
# always started, so a pull request can never sit pending on a skipped check.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust foundation (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned compiler and checks
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Build, test, format and lint the locked workspace
        run: make rust-build rust-test rust-check

  toolchain:
    name: Verus toolchain (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the pinned compiler components
        run: rustup toolchain install 1.98.1 --profile minimal --component rustc-dev --component llvm-tools
      - name: Qualify Cargo erasure, verification and a rejected body mutation
        run: make verify-toolchain
      - name: Verify kernel contracts and reject removed safety guards
        run: make verify-kernel
      - name: Preserve toolchain evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verus-toolchain-linux
          path: |
            .compat/verification/*.json
            .compat/verification/*.log
          if-no-files-found: warn

  native-baseline:
    name: native-baseline (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Qualify the immutable Go baseline on this native runner
        run: python -S tools/compat/native.py
      - name: Preserve native evidence, including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-baseline-linux
          path: .compat/native
          if-no-files-found: error

  contract:
    name: contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build fixed baseline and reconcile the command census
        run: |
          make compat-reference
          diff -u tests/contract/commands.json .compat/reference/commands.json
          python3 -S tools/compat/build_reference.py --output .compat/version-override --version contract-override
          make compat-frontmatter
          make compat-templates
          make compat-ids
          make compat-request-lifecycle
          make compat-requests
          make compat-memories
          make compat-handoffs
          make compat-plan-foundation
          make compat-plan-graph
          make compat-plan-encode
          make compat-plan-parse
          make compat-plan-ref
          make compat-plan-bundle
          make compat-config-foundation
      - name: Install the pinned Rust compiler for cross-language reading
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Read actual Rust-generated issue files with the fixed Go reader
        run: make compat-domain-read
      - name: Read actual Rust-generated requests with the fixed Go reader
        run: make compat-request-read
      - name: Read actual Rust-generated memories with the fixed Go reader
        run: make compat-memory-read
      - name: Read actual Rust-generated handoffs with the fixed Go reader
        run: make compat-handoff-read
      - name: Read actual Rust-generated plan manifests with the fixed Go reader
        run: make compat-plan-encode-read
      - name: Read actual Rust graph-reference edits with the fixed Go reader
        run: make compat-plan-ref-read
      - name: Read actual Rust bundle snapshots with the fixed Go validator
        run: make compat-plan-bundle-read
      - name: Replay the oracle and reject deliberately broken candidates
        run: make compat-cli compat-http compat-journey compat-signals compat-io compat-test
      - uses: actions/setup-node@v7
        with:
          node-version: '24.12.0'
      - name: Build and compare full embedded UI assets
        run: make compat-assets-reference compat-assets
      - name: Preserve contract mismatches
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: contract-failures-linux
          path: |
            .compat/failures
            .compat/cross-read
          if-no-files-found: ignore

  ui:
    name: ui
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      # The go job embeds this build so the release binary carries the real
      # UI; a plain `go build` without it still compiles against the
      # committed placeholder.
      - name: Upload the built UI
        uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: ui/dist
          if-no-files-found: error

  go:
    name: go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: ui
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the built UI
        uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: ui/dist

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: make vet

      # The action runs `golangci-lint run` itself with the pinned version and
      # the repository's .golangci.yml; locally, `make lint` is the same command.
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

      - name: Test
        run: make test

      - name: Build
        run: make build

      - name: Tidy check
        run: make tidy-check

      - name: Version is linked and the UI is embedded
        run: |
          ./bin/bn --version
          ./bin/bn --help >/dev/null
          test "$(ls ui/dist/assets | wc -l)" -gt 0
